[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-sdk"
version = "1.1.0"
description = "Python SDK for Climate Risk Commons data access and workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Riskthinking.AI" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "crc-framework>=1.1,<2",
    "numpy>=1.23",
    "typing-extensions>=4.12",
    "jsonschema>=4.18,<5",
    "rfc3339-validator>=0.1.4",
    "h3>=4.2",
    "shapely>=2",
    "duckdb>=1.4,<3",
    "pyarrow>=18",
    "fsspec>=2024",
    # PyArrow converts zoned timestamps with the IANA database, which Windows lacks.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/RiskThinking/crc-sdk"
Repository = "https://github.com/RiskThinking/crc-sdk"
Issues = "https://github.com/RiskThinking/crc-sdk/issues"

[project.optional-dependencies]
zarr = [
    "zarr>=3.1,<4",
]
raster = [
    "rasterio>=1.4",
]
netcdf = [
    "h5netcdf>=1.3",
    "h5py>=3",
]
test = [
    "types-jsonschema",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crc_sdk*"]

[tool.setuptools.package-data]
crc_sdk = [
    "py.typed",
    "contracts/api/*.json",
    "contracts/schemas/*.json",
    "contracts/fixtures/*.json",
    "contracts/taxonomy/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["crc_sdk", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Public enums keep `str, Enum`: StrEnum changes str() and format() output.
ignore = ["UP042"]

[tool.ruff.format]
# Docs keep compact multi-argument examples to save reader tokens.
exclude = ["*.md"]
