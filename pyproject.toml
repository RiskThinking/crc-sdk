[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-sdk"
version = "0.1.0"
description = "Python SDK for Climate Risk Commons data access and workflows"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Riskthinking.AI" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "crc-framework>=0.1,<0.2",
    "pydantic>=2,<3",
]

# temp source until crc-framework is published to PyPI
[tool.uv.sources]
crc-framework = { git = "ssh://git@github.com/RiskThinking/crc-framework-rs.git", branch = "main" }

[project.optional-dependencies]
connectors = [
    "duckdb>=1,<2",
    "psutil>=5",
    "pyarrow>=14",
    "s3fs>=2024",
    "zarr>=2.18,<3",
]
geometry = [
    "h3>=4",
    "shapely>=2",
]
test = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crc_sdk*"]

[tool.setuptools.package-data]
crc_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["crc_sdk", "tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
