name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: Paired framework branch or commit
        type: string
  workflow_call:
    inputs:
      framework_ref:
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Contracts and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ inputs.framework_ref || vars.CRC_FRAMEWORK_REF || 'main' }}
          path: crc-framework-rs
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Install locked paired packages
        run: uv sync --locked --all-extras --python 3.12
      - name: Verify declared release and Python contracts
        run: |
          .venv/bin/python tools/api_contracts/check.py
          .venv/bin/python tools/generate_dataset_contracts.py --check
          .venv/bin/python tools/generate_evidence_contracts.py --check
          .venv/bin/python tools/generate_collection_contracts.py --check
          .venv/bin/python tools/generate_evaluation_contracts.py --check
          .venv/bin/python ../crc-framework-rs/tools/sync_data_contracts.py --sdk . --check
          .venv/bin/python ../crc-framework-rs/tools/api_contracts/check.py
      - name: Ruff
        run: |
          uv run --locked --all-extras --python 3.12 ruff check .
          uv run --locked --all-extras --python 3.12 ruff format --check .
      - name: Mypy
        run: uv run --locked --all-extras --python 3.12 mypy

  tests:
    name: ${{ matrix.os }} Python ${{ matrix.python }}${{ matrix.pyarrow && format(' / PyArrow {0}', matrix.pyarrow) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.12', pyarrow: '18.0.0'}
    defaults:
      run:
        shell: bash
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ inputs.framework_ref || vars.CRC_FRAMEWORK_REF || 'main' }}
          path: crc-framework-rs
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Build paired wheels
        run: |
          uv build --project ../crc-framework-rs --wheel --python "${{ matrix.python }}" --out-dir "$RUNNER_TEMP/framework-wheel"
          uv build --no-sources --python "${{ matrix.python }}" --out-dir "$RUNNER_TEMP/sdk-wheel"
      - name: Verify base installs and public interfaces
        run: |
          set -euo pipefail
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/wheel-venv"
          if [[ "$RUNNER_OS" == Windows ]]; then
            wheel_python="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-venv/bin/python"
          fi
          uv pip install --python "$wheel_python" "$RUNNER_TEMP"/framework-wheel/*.whl "$RUNNER_TEMP"/sdk-wheel/*.whl
          uv pip check --python "$wheel_python"
          echo "WHEEL_PYTHON=$wheel_python" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-framework-rs/tools/api_contracts/check.py" --runtime
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-sdk/tools/api_contracts/check.py" --runtime
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-sdk/tools/check_wheels.py"
      - name: Run offline tests and guides on installed wheels
        env:
          PYARROW_VERSION: ${{ matrix.pyarrow }}
        run: |
          set -euo pipefail
          wheels=( "$RUNNER_TEMP"/sdk-wheel/*.whl )
          uv export --locked --all-extras --no-emit-local --no-hashes --output-file "$RUNNER_TEMP/test-requirements.txt" --quiet
          if [[ -n "$PYARROW_VERSION" ]]; then
            sed -i "/^pyarrow==/s/==[0-9.]*/==$PYARROW_VERSION/" "$RUNNER_TEMP/test-requirements.txt"
          fi
          uv pip install --python "$WHEEL_PYTHON" -r "$RUNNER_TEMP/test-requirements.txt" "${wheels[0]}[zarr,netcdf,raster,test]" "$RUNNER_TEMP"/framework-wheel/*.whl
          uv pip check --python "$WHEEL_PYTHON"
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -I -m pytest -q --import-mode=importlib "$GITHUB_WORKSPACE/crc-sdk/tests"
          "$WHEEL_PYTHON" -I "$GITHUB_WORKSPACE/crc-sdk/tools/check_examples.py"
