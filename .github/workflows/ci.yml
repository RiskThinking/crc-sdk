name: Validate

on:
  push:
    branches: [main, codex/python-v1]
  pull_request:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: Paired framework branch or commit
        type: string
        default: codex/python-v1
  workflow_call:
    inputs:
      framework_ref:
        type: string
        default: codex/python-v1
    secrets:
      CRC_COMPAT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Contracts and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ inputs.framework_ref || 'codex/python-v1' }}
          path: crc-framework-rs
          token: ${{ secrets.CRC_COMPAT_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Install locked paired packages
        run: uv sync --locked --all-extras --python 3.12
      - name: Verify declared release and Python contracts
        run: |
          .venv/bin/python tools/api_contracts/check.py
          .venv/bin/python tools/generate_dataset_contracts.py --check
          .venv/bin/python tools/generate_evidence_contracts.py --check
          .venv/bin/python ../crc-framework-rs/tools/sync_data_contracts.py --sdk . --check
          .venv/bin/python ../crc-framework-rs/tools/api_contracts/check.py
      - name: Ruff
        run: |
          uv run --locked --all-extras --python 3.12 ruff check .
          uv run --locked --all-extras --python 3.12 ruff format --check .
      - name: Mypy
        run: uv run --locked --all-extras --python 3.12 mypy

  tests:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
    defaults:
      run:
        shell: bash
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ inputs.framework_ref || 'codex/python-v1' }}
          path: crc-framework-rs
          token: ${{ secrets.CRC_COMPAT_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Install locked paired packages
        run: uv sync --locked --all-extras --python "${{ matrix.python }}"
      - name: Check dependencies and run offline tests
        run: |
          uv pip check --python .venv
          uv run --locked --all-extras --python "${{ matrix.python }}" pytest -q
      - name: Build paired wheels
        run: |
          uv build --project ../crc-framework-rs --wheel --python "${{ matrix.python }}" --out-dir "$RUNNER_TEMP/framework-wheel"
          uv build --no-sources --out-dir "$RUNNER_TEMP/sdk-wheel"
      - name: Verify installed wheel versions and packaged contracts
        run: |
          set -euo pipefail
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/wheel-venv"
          if [[ "$RUNNER_OS" == Windows ]]; then
            wheel_python="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-venv/bin/python"
          fi
          uv pip install --python "$wheel_python" "$RUNNER_TEMP"/framework-wheel/*.whl "$RUNNER_TEMP"/sdk-wheel/*.whl
          uv pip check --python "$wheel_python"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-sdk/tools/check_wheels.py"
