name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: Framework branch, tag or commit to build instead of the locked release
        type: string
  workflow_call:
    inputs:
      framework_ref:
        type: string

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its running checks. Branch, tag and
  # release runs get a group of their own, so they are never queued or cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Contracts and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Resolve the framework revision
        id: framework
        env:
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          version=$(uv run --no-project --python 3.12 python -c 'import json; print(json.load(open("crc_sdk/contracts/api/release.json"))["packages"]["framework"])')
          echo "ref=${FRAMEWORK_REF:-v$version}" >> "$GITHUB_OUTPUT"
      # The framework repository supplies the shared contract tools. Its source
      # is built only when a framework_ref replaces the locked release.
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ steps.framework.outputs.ref }}
          path: crc-framework-rs
          persist-credentials: false
      - if: inputs.framework_ref
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.framework_ref
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Install locked packages
        env:
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          uv sync --locked --all-extras --python 3.12
          if [[ -n "$FRAMEWORK_REF" ]]; then
            uv pip install --python .venv ../crc-framework-rs
          fi
      - name: Verify declared release and Python contracts
        run: |
          .venv/bin/python tools/api_contracts/check.py
          .venv/bin/python tools/generate_dataset_contracts.py --check
          .venv/bin/python tools/generate_evidence_contracts.py --check
          .venv/bin/python tools/generate_collection_contracts.py --check
          .venv/bin/python tools/generate_evaluation_contracts.py --check
          .venv/bin/python ../crc-framework-rs/tools/sync_data_contracts.py --sdk . --check
          .venv/bin/python ../crc-framework-rs/tools/api_contracts/check.py
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy

  tests:
    name: ${{ matrix.os }} Python ${{ matrix.python }}${{ matrix.pyarrow && format(' / PyArrow {0}', matrix.pyarrow) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.12', pyarrow: '18.0.0'}
    defaults:
      run:
        shell: bash
        working-directory: crc-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: crc-sdk
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Resolve the framework revision
        id: framework
        env:
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          version=$(uv run --no-project --python 3.12 python -c 'import json; print(json.load(open("crc_sdk/contracts/api/release.json"))["packages"]["framework"])')
          echo "ref=${FRAMEWORK_REF:-v$version}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: RiskThinking/crc-framework-rs
          ref: ${{ steps.framework.outputs.ref }}
          path: crc-framework-rs
          persist-credentials: false
      - if: inputs.framework_ref
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.framework_ref
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crc-framework-rs -> target
      - name: Build wheels
        env:
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          uv build --python "${{ matrix.python }}" --out-dir "$RUNNER_TEMP/sdk-wheel"
          mkdir -p "$RUNNER_TEMP/framework-wheel"
          if [[ -n "$FRAMEWORK_REF" ]]; then
            uv build --project ../crc-framework-rs --wheel --python "${{ matrix.python }}" --out-dir "$RUNNER_TEMP/framework-wheel"
          fi
          # Locked versions constrain every install; a framework built from
          # source replaces the locked release.
          uv export --locked --all-extras --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/locked.txt" --quiet
          if [[ -n "$FRAMEWORK_REF" ]]; then
            sed -i '/^crc-framework==/d' "$RUNNER_TEMP/locked.txt"
          fi
      - name: Verify base installs and public interfaces
        run: |
          set -euo pipefail
          shopt -s nullglob
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/wheel-venv"
          if [[ "$RUNNER_OS" == Windows ]]; then
            wheel_python="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-venv/bin/python"
          fi
          uv pip install --python "$wheel_python" -c "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP"/sdk-wheel/*.whl "$RUNNER_TEMP"/framework-wheel/*.whl
          uv pip check --python "$wheel_python"
          echo "WHEEL_PYTHON=$wheel_python" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-framework-rs/tools/api_contracts/check.py" --runtime
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-sdk/tools/api_contracts/check.py" --runtime
          "$wheel_python" -I "$GITHUB_WORKSPACE/crc-sdk/tools/check_wheels.py"
      - name: Run offline tests and guides on installed wheels
        env:
          PYARROW_VERSION: ${{ matrix.pyarrow }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=( "$RUNNER_TEMP"/sdk-wheel/*.whl )
          if [[ -n "$PYARROW_VERSION" ]]; then
            sed -i "/^pyarrow==/s/==[0-9.]*/==$PYARROW_VERSION/" "$RUNNER_TEMP/locked.txt"
          fi
          uv pip install --python "$WHEEL_PYTHON" -r "$RUNNER_TEMP/locked.txt" "${wheels[0]}[zarr,netcdf,raster,test]" "$RUNNER_TEMP"/framework-wheel/*.whl
          uv pip check --python "$WHEEL_PYTHON"
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -I -m pytest -q --import-mode=importlib "$GITHUB_WORKSPACE/crc-sdk/tests"
          "$WHEEL_PYTHON" -I "$GITHUB_WORKSPACE/crc-sdk/tools/check_examples.py"
